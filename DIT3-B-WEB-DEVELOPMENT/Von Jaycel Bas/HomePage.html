<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home Page</title>

  <style>
    body {
      margin: 0; 
      padding: 0; 
      font-family: Arial, sans-serif;
      background: url("darkbg.jpg") center;
      background-size: cover;
      color: white;
      animation: fadeInBg 2s ease-in forwards;
    }

    /* HEADER */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 40px;
      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(5px);
      animation: slideDown 1s ease-in-out;
    }

    h1 {
      color: #25d9f8;
    }

    nav a {
      color: white;
      text-decoration: none;
      margin: 0 20px;
      font-size: 18px;
      font-weight: bold;
      transition: 0.3s;
    }

    nav a:hover {
      color: #25d9f8;
    }

    /* HERO SECTION */
    .hero {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 120px 80px;
      animation: fadeUp 1.5s ease-in-out 0.3s;
    }

    .hero-text h2 {
      font-size: 55px;
      margin: 0;
    }

    .hero-text span {
      color: #25d9f8;
    }

    .hero-text p {
      font-size: 20px;
      margin-top: 15px;
      max-width: 500px;
    }

    .btn-start {
      display: inline-block;
      margin-top: 30px;
      padding: 15px 30px;
      background: linear-gradient(to right, #25d9f8, #b832f5);
      color: white;
      border-radius: 8px;
      font-size: 18px;
      text-decoration: none;
      font-weight: bold;
      animation: pulse 2s infinite;
    }

    .btn-start:hover { opacity: 0.8; }

    /* PRODUCT SLIDER BOX */
    .product-preview {
      width: 420px;
      background: rgba(255, 255, 255, 0.08);
      padding: 15px;
      border-radius: 15px;
      border: 3px solid #25d9f8;
      text-align: center;
      position: relative;
    }

     .product-preview:hover {
  transform: translateY(-8px);
  box-shadow: 0 0 25px #25d9f8;
}

    .slider-img {
      width: 100%;
      border-radius: 10px;
      transition: 0.5s ease;
    }

    .product-name {
      font-size: 28px;
      margin-top: 10px;
      color: #25d9f8;
    }

    .price {
      font-size: 22px;
    }

    /* ARROWS */
    .arrow {
      position: absolute;
      top: 45%;
      transform: translateY(-50%);
      font-size: 35px;
      color: white;
      background: rgba(0,0,0,0.4);
      padding: 8px 15px;
      border-radius: 50%;
      cursor: pointer;
      user-select: none;
      transition: 0.3s;
    }

    .arrow:hover {
      background: rgba(0,0,0,0.7);
    }

    .left { left: 10px; }
    .right { right: 10px; }

    /* ANIMATIONS */
    @keyframes fadeInBg {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @keyframes slideDown {
      from { opacity: 0; transform: translateY(-50px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(40px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.05); }
      100% { transform: scale(1); }
    }
  </style>
</head>

<body>

<header>
  <h1>G3 Gadget</h1>
  <nav>
    <a href="HomePage.html">HOME</a>
    <a href="about.html">ABOUT</a>
    <a href="Contact.html">CONTACT</a>
    <a href="products.html">PRODUCTS</a>
    <a href="cart.html">CART <span style="color:red;">0</span></a>
    <a href="checkout.html">CHECKOUT</a>
    <a href="login.html">LOGOUT</a>
  </nav>
</header>

<section class="hero">

  <!-- LEFT TEXT -->
  <div class="hero-text">
    <h2>Welcome to <span>G3 Gadget</span></h2>
    <p>Your trusted online store for laptops, phones, keyboards, mouse, chargers, headphones, and more.</p>
    <a href="products.html" class="btn-start">START SHOPPING</a>
  </div>

  <!-- RIGHT PRODUCT SLIDER -->
  <div class="product-preview">

    <span class="arrow left" onclick="prevSlide()">&#10094;</span>
    <span class="arrow right" onclick="nextSlide()">&#10095;</span>

    <img id="sliderImage" class="slider-img" src="laptop.png">

    <div class="product-name" id="pname">Gaming Laptop</div>
    <div class="price" id="pprice">₱78,899</div>
    <button class="add-btn" onclick="addSliderToCart()">Add to Cart</button>

  </div>

</section>

<script>
  // Slider Data
  const products = [
    { img: "laptop.png", name: "Gaming Laptop", price: 78899 },
    { img: "phone.png", name: "Smartphone Pro Max", price: 45999 },
    { img: "keyboard.png", name: "RGB Mechanical Keyboard", price: 2499 },
    { img: "mouse.png", name: "Gaming Mouse", price: 1199 },
    { img: "headset.png", name: "Wireless Headset", price: 1899 }
  ];

  let index = 0;

  function showSlide(i) {
    document.getElementById("sliderImage").src = products[i].img;
    document.getElementById("pname").innerText = products[i].name;
    document.getElementById("pprice").innerText = `₱${products[i].price.toLocaleString()}`;
  }

  function nextSlide() {
    index = (index + 1) % products.length;
    showSlide(index);
  }

  function prevSlide() {
    index = (index - 1 + products.length) % products.length;
    showSlide(index);
  }

  // AUTO SLIDE
  setInterval(nextSlide, 5000);

  // CART SYSTEM
  let cart = JSON.parse(localStorage.getItem("cart")) || [];
  const cartCountSpan = document.querySelector("nav a[href='cart.html'] span");

  function updateCartCount() {
    cartCountSpan.innerText = cart.length;
    localStorage.setItem("cartCount", cart.length);
  }

  // Initialize counter
  updateCartCount();

  function addSliderToCart() {
    const product = products[index]; // current product in slider
    cart.push(product);
    localStorage.setItem("cart", JSON.stringify(cart));
    updateCartCount();
    alert(`${product.name} added to cart!`);
  }
</script>

<style>
  /* Optional: style the Add to Cart button in slider */
  .add-btn {
    margin-top: 15px;
    padding: 12px 25px;
    background: #25d9f8;
    color: white;
    border: none;
    border-radius: 8px;
    font-weight: bold;
    cursor: pointer;
    font-size: 16px;
    transition: 0.3s;
  }
  .add-btn:hover { opacity: 0.8; }
</style>


</body>
</html>
