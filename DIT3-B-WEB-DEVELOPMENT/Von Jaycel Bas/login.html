<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login Form</title>

  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Arial;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: url("darkbg.jpg") center;
      background-size: cover;
    }

    .main-box {
      background-color: white;
      padding: 20px;
      border: 3px solid blue;
      width: 280px;
      background: rgba(0, 0, 0, 0.6);
    }

    .box {
      border: 2px solid blue;
      padding: 15px;
      margin-bottom: 15px;
      background: white;
    }

    .box-title {
      padding: 15px;
      text-align: center;
      font-size: 20px;
      font-weight: bold;
      color: white;
      background: blue;
    }

    .button-group input {
      width: 110px;
      padding: 7px;
      border: none;
      cursor: pointer;
      font-weight: bold;
    }

   .form-group input { 
     width: 90%; 
     padding: 3px 6px; 
     font-size: 13px; 
     border: 1px solid black; 
     height: 28px; 
     display: block; 
     margin: 0 auto;
 }

    .login-btn {
      background: blue;
      color: white;
    }

    .cancel-btn {
      background: gray;
    }

    .login-btn:hover { 
      background-color: blue; 
      transform: scale(1.05); 
    } 

    .cancel-btn:hover { 
      background-color: red; 
      transform: scale(1.05); 
    }

    .cancel-btn:hover {
      background: red;
    }

    .register-link {
      text-align: center;
      margin-top: 10px;
      font-size: 13px;
    }
  </style>
</head>
<body>

  <form class="main-box" onsubmit="return loginUser();">
    <div class="box">
      <div class="box-title">LOGIN FORM</div>
    </div>

    <div class="box">
      <div class="form-group">
      <label>Username:</label>
      <input type="text" id="logUser" required> </div>

      <div class="form-group">
      <label>Password:</label>
      <input type="password" id="logPass" required> </div>
    </div>

    <div class="box">
      <div class="button-group">
        <input type="submit" value="Login" class="login-btn">
        <input type="reset" value="Cancel" class="cancel-btn">
      </div>

      <div class="register-link">
        Don't have an account? <a href="registration.html">Register</a>
      </div>
    </div>
  </form>

  <script>
    function loginUser() {
      let savedUser = localStorage.getItem("savedUser");
      let savedPass = localStorage.getItem("savedPass");

      let username = document.getElementById("logUser").value;
      let password = document.getElementById("logPass").value;

      if (username === savedUser && password === savedPass) {
        alert("Login successful!");
        window.location.href = "HomePage.html";
        return false;
      } else {
        alert("Invalid username or password!\nPlease register first.");
        return false;
      }
    }
  </script>

</body>
</html>
